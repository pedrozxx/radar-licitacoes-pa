name: Publicar no GitHub Pages

# O site é estático: lê o snapshot que o coletor grava, sem chamar API nenhuma
# em tempo de visita. Por isso o Pages basta — não é preciso servidor.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Commits do GITHUB_TOKEN não disparam outro workflow por push.
  workflow_run:
    workflows: [Coletar dados do PNCP]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que está em andamento: interromper no
# meio deixaria o site publicado em estado indefinido.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # O head_sha do workflow de coleta precede o commit dos novos dados.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        # O Pages serve em /radar-licitacoes-pa/, não na raiz. Sem BASE_PATH o
        # HTML pediria /assets/... e receberia 404 — página em branco.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Impedir o Jekyll de processar a saída
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
